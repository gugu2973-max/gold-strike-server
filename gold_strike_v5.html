<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GOLD STRIKE V3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;color:#fff;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;font-weight:bold;text-shadow:0 2px 5px #000}.pill{background:#101820c9;padding:9px 12px;border:1px solid #ffffff44;border-radius:12px}
.cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:'';position:absolute;background:#fff;box-shadow:0 0 4px #000}.cross:before{width:2px;height:22px;left:10px}.cross:after{height:2px;width:22px;top:10px}
#hit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:34px;color:#ffdb63;opacity:0}
.controls{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 13px;pointer-events:none}
.stick{width:116px;height:116px;border-radius:50%;border:2px solid #ffffff66;background:#ffffff18;position:relative;pointer-events:auto;touch-action:none}.nub{position:absolute;width:46px;height:46px;left:33px;top:33px;border-radius:50%;background:#ffffff88;border:2px solid white}
.buttons{display:grid;grid-template-columns:repeat(2,68px);gap:9px;pointer-events:auto}.btn{width:68px;height:58px;border:1px solid #ffffff88;border-radius:15px;background:#172432e8;color:white;font-weight:bold;font-size:11px;touch-action:none}.btn.fire{background:#b87914ed}.btn:active{filter:brightness(1.5);transform:scale(.97)}
#tip{position:absolute;top:58%;left:50%;transform:translateX(-50%);font-size:12px;color:#fff9;text-shadow:0 2px 5px #000;white-space:nowrap}
</style>
</head><body>
<div id="game"></div><div id="hud">
<div class="top"><div class="pill">GOLD STRIKE <span style="color:#ffd05b">V3</span></div><div class="pill" id="health">HP 1000</div><div class="pill" id="ammo">30 / 90</div></div>
<div class="cross"></div><div id="hit">✣</div><div id="tip">Слева — движение · Справа — обзор</div>
<div class="controls"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="buttons"><button class="btn fire" id="fire">ОГОНЬ</button><button class="btn" id="reload">ПЕРЕЗАРЯДКА</button><button class="btn" id="knife">КЕРАМБИТ</button><button class="btn" id="jump">ПРЫЖОК</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>
(()=>{'use strict';
const root=document.getElementById('game');
if(!window.THREE){root.innerHTML='<div style="padding:24px;color:white">Не удалось загрузить 3D. Проверь интернет и обнови страницу.</div>';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ba9b5);scene.fog=new THREE.Fog(0x8ba9b5,28,90);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe8f4ff,0x59604b,2.1));
const sun=new THREE.DirectionalLight(0xffedcf,2.3);sun.position.set(-8,18,10);scene.add(sun);
const mat=(c,r=.82,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const concrete=mat(0xb5b1a0), dark=mat(0x343c40), wood=mat(0x76533a), gold=mat(0xffc52e,.23,.85);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(0x777d68));floor.rotation.x=-Math.PI/2;floor.position.y=-.08;scene.add(floor);
const grid=new THREE.GridHelper(100,50,0x69715e,0x69715e);grid.position.y=-.065;scene.add(grid);
function box(x,y,z,w,h,d,material){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);scene.add(o);return o}
box(0,2,-24,48,4,1,concrete);box(-24,2,0,1,4,48,concrete);box(24,2,0,1,4,48,concrete);box(0,2,24,48,4,1,concrete);
for(let i=0;i<7;i++){let x=-15+i*5.1;box(x,.06,-23.45,4.7,.12,.08,dark)}
// cover crates with bevel-like layered details
function crate(x,z,s=2){box(x,.65,z,s,1.3,s,wood);for(let y=.25;y<1.3;y+=.42)box(x,y,z,s+.025,.055,s+.025,mat(0x4c382b));}
crate(-7,-7,2.6);crate(6,-12,2.8);crate(10,4,2.4);crate(-11,8,2.6);crate(0,-18,3.2);
for(let x of [-18,18])for(let z of [-16,-4,8,18]){box(x,1.6,z,.5,3.2,.5,mat(0x6b716b));box(x,3.3,z,.9,.18,.9,mat(0xc4b99d));}
const player=new THREE.Group();player.position.set(0,0,7);scene.add(player);player.add(camera);camera.position.set(0,1.62,0);
// detailed rifle, attached to camera
const gun=new THREE.Group();camera.add(gun);gun.position.set(.34,-.29,-.58);
const gunBlack=mat(0x20272d,.38,.55), gunMetal=mat(0x59636a,.28,.8), gripMat=mat(0x4c3020);
function gbox(x,y,z,w,h,d,m){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);gun.add(o);return o}
gbox(0,0,-.12,.17,.19,.48,gunBlack);gbox(0,.015,-.43,.095,.095,.42,gunMetal);gbox(0,-.12,.04,.13,.28,.16,gripMat).rotation.x=-.18;
gbox(0,.13,-.16,.075,.08,.15,gunBlack);gbox(0,.18,-.16,.12,.035,.12,gold);gbox(-.11,-.02,-.06,.035,.12,.26,gunMetal);
gbox(0,-.105,-.23,.12,.07,.24,gunBlack);gbox(.0,-.22,-.02,.11,.05,.22,gripMat);
// muzzle
const muzzle=new THREE.Mesh(new THREE.SphereGeometry(.075,8,8),new THREE.MeshBasicMaterial({color:0xffc34d}));muzzle.position.set(0,0,-.68);muzzle.visible=false;gun.add(muzzle);
// curved karambit, custom extruded crescent-like blade
const knife=new THREE.Group();camera.add(knife);knife.position.set(.43,-.27,-.55);knife.visible=false;
const handleMat=mat(0x171a20,.3,.45), ringMat=mat(0xd89b19,.22,.8);
const handle=new THREE.Mesh(new THREE.TorusGeometry(.105,.035,8,18,Math.PI*1.65),handleMat);handle.rotation.z=-.2;handle.position.set(0,-.16,.03);knife.add(handle);
const grip=new THREE.Mesh(new THREE.CylinderGeometry(.052,.065,.31,10),handleMat);grip.rotation.z=-.18;grip.position.set(0,-.02,.02);knife.add(grip);
const bladeShape=new THREE.Shape();bladeShape.moveTo(-.02,-.12);bladeShape.quadraticCurveTo(.22,-.05,.23,.16);bladeShape.quadraticCurveTo(.22,.37,.02,.42);bladeShape.quadraticCurveTo(.12,.22,.08,.12);bladeShape.quadraticCurveTo(.04,.04,-.02,-.12);
const bladeGeo=new THREE.ExtrudeGeometry(bladeShape,{depth:.035,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.018,bevelThickness:.018});
const bladeMesh=new THREE.Mesh(bladeGeo,gold);bladeMesh.position.set(.0,.02,-.04);knife.add(bladeMesh);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.09,.018,8,20),ringMat);ring.position.set(0,-.16,.07);knife.add(ring);
// targets with visible head/chest, raycast hit detection
const bots=[];function bot(x,z){const group=new THREE.Group();const uniform=mat(0x263e50),vest=mat(0x9b4937),skin=mat(0xc99a76);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.72,4,8),uniform);body.position.y=1.05;group.add(body);
const chest=new THREE.Mesh(new THREE.BoxGeometry(.67,.55,.34),vest);chest.position.set(0,1.12,0);group.add(chest);
const head=new THREE.Mesh(new THREE.SphereGeometry(.24,14,12),skin);head.position.y=1.72;group.add(head);
const helmet=new THREE.Mesh(new THREE.SphereGeometry(.255,14,8,0,Math.PI*2,0,Math.PI/2),mat(0x29333b));helmet.position.y=1.82;group.add(helmet);
for(let side of [-1,1]){const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.105,.48,3,7),uniform);arm.position.set(side*.43,1.15,0);arm.rotation.z=side*.22;group.add(arm);}
const botGun=new THREE.Group();
const bg1=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.72),gunBlack);bg1.position.set(.2,1.18,.25);botGun.add(bg1);
const bg2=new THREE.Mesh(new THREE.BoxGeometry(.075,.075,.42),gunMetal);bg2.position.set(.2,1.19,.72);botGun.add(bg2);
const bg3=new THREE.Mesh(new THREE.BoxGeometry(.10,.22,.12),gripMat);bg3.position.set(.2,1.03,.18);botGun.add(bg3);
group.add(botGun);
group.position.set(x,0,z);scene.add(group);bots.push({group,hp:100,alive:true,nextShot:1.25+Math.random()*.85});}
bot(-4,-13);bot(5,-17);bot(12,-8);bot(-13,-3);bot(2,-5);
bot(15,-17);bot(-17,-15);bot(17,7);bot(-17,15);bot(8,15);bot(-7,17);bot(0,-21);
const MAX_HP=1000;
let yaw=0,pitch=0,ammo=30,reloading=false,cool=0,knifeMode=false,vy=0,playerHP=MAX_HP,botDamageFlash=0;
const move={x:0,y:0};const healthEl=document.getElementById('health');const ammoEl=document.getElementById('ammo');
function updateAmmo(){ammoEl.textContent=ammo+' / 90';}
const raycaster=new THREE.Raycaster();let hitTimer=0;
function damageBot(b,amount){if(!b||!b.alive)return;b.hp-=amount;document.getElementById('hit').style.opacity=1;hitTimer=.16;if(b.hp<=0){b.alive=false;b.group.visible=false;}}
function knifeAttack(){if(cool>0)return;cool=.48;knife.visible=true;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));let best=null,bestDist=2.65;
for(const b of bots){if(!b.alive)continue;const delta=b.group.position.clone().sub(player.position);const dist=delta.length();delta.y=0;if(dist<bestDist&&delta.normalize().dot(forward)>.15){best=b;bestDist=dist;}}
if(best)damageBot(best,150);knife.rotation.x=-.65;setTimeout(()=>knife.rotation.x=0,140);}
function shoot(){if(knifeMode){knifeAttack();return;}if(reloading||cool>0)return;if(ammo<=0){reload();return;}ammo--;updateAmmo();cool=.16;muzzle.visible=true;setTimeout(()=>muzzle.visible=false,65);gun.position.z=-.53;setTimeout(()=>gun.position.z=-.58,55);
raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const targets=[];for(const b of bots)if(b.alive)targets.push(...b.group.children);
const hits=raycaster.intersectObjects(targets,false);if(hits.length){const target=hits[0].object;const b=bots.find(q=>q.group===target.parent);if(b)damageBot(b,target.geometry.type==='SphereGeometry'?100:50);}}
function reload(){if(reloading||ammo===30)return;reloading=true;document.getElementById('reload').textContent='...';setTimeout(()=>{ammo=30;reloading=false;updateAmmo();document.getElementById('reload').textContent='ПЕРЕЗАРЯДКА';},1250);}
function toggleKnife(){knifeMode=!knifeMode;knife.visible=knifeMode;gun.visible=!knifeMode;document.getElementById('knife').textContent=knifeMode?'НОЖ ВКЛ':'КЕРАМБИТ';}
function bind(id,fn){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn();});}
bind('fire',shoot);bind('reload',reload);bind('knife',toggleKnife);bind('jump',()=>{if(player.position.y<.03)vy=5.3;});
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let sid=null;
function moveStick(e){const r=stick.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=42;if(l>m){dx=dx/l*m;dy=dy/l*m;}nub.style.transform=`translate(${dx}px,${dy}px)`;move.x=dx/m;move.y=dy/m;}
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);moveStick(e);});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)moveStick(e);});
function stopStick(e){if(e.pointerId===sid){sid=null;move.x=move.y=0;nub.style.transform='translate(0,0)';}}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
let lookId=null,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{lookId=e.pointerId;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(lookId);});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;let dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.0042;pitch-=dy*.0034;pitch=THREE.MathUtils.clamp(pitch,-1.15,1.15);});
function endLook(e){if(e.pointerId===lookId)lookId=null;}renderer.domElement.addEventListener('pointerup',endLook);renderer.domElement.addEventListener('pointercancel',endLook);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));}addEventListener('resize',resize);
let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;cool=Math.max(0,cool-dt);if(hitTimer>0){hitTimer-=dt;if(hitTimer<=0)document.getElementById('hit').style.opacity=0;}
player.rotation.y=yaw;camera.rotation.x=pitch;let f=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
player.position.addScaledVector(f,-move.y*dt*5);player.position.addScaledVector(r,move.x*dt*5);player.position.x=THREE.MathUtils.clamp(player.position.x,-21,21);player.position.z=THREE.MathUtils.clamp(player.position.z,-21,21);
if(player.position.y>0||vy>0){vy-=13*dt;player.position.y=Math.max(0,player.position.y+vy*dt);if(player.position.y===0)vy=0;}
bots.forEach((b,i)=>{if(!b.alive)return;const dx=player.position.x-b.group.position.x,dz=player.position.z-b.group.position.z,dist=Math.hypot(dx,dz);
b.group.rotation.y=Math.atan2(dx,dz);
if(dist>3.2&&dist<24){const speed=dist>8?1.05:.48;b.group.position.x+=dx/dist*speed*dt;b.group.position.z+=dz/dist*speed*dt;}
b.nextShot-=dt;if(b.nextShot<=0&&dist<19){b.nextShot=1.25+Math.random()*.85;if(Math.random()<.45){playerHP=Math.max(0,playerHP-(dist<5?2:1));healthEl.textContent='HP '+playerHP;botDamageFlash=.18;document.body.style.boxShadow='inset 0 0 38px #e22';setTimeout(()=>document.body.style.boxShadow='',130);if(playerHP===0){playerHP=MAX_HP;healthEl.textContent='HP '+MAX_HP;player.position.set(0,0,7);yaw=0;pitch=0;}}}
});renderer.render(scene,camera);}
requestAnimationFrame(animate);
})();
</script></body></html>
